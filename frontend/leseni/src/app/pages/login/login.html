<!-- Login page: branding left, form right -->
<div class="min-h-[calc(100dvh-5rem)] grid lg:grid-cols-2">

  <!-- Left: Brand chapter — light soft panel with green accents -->
  <section class="hidden lg:flex flex-col items-start justify-center bg-soft px-12 py-16">
    <div class="max-w-sm flex flex-col gap-6">
      <span class="inline-block h-3 w-3 bg-primary" aria-hidden="true"></span>
      <h2 class="text-4xl font-bold leading-[1.25] text-foreground">e-Leseni Platform</h2>
      <p class="text-lg leading-[1.75] text-muted">
        Business licensing, simplified.
      </p>

      <div class="border-t border-hairline pt-6 flex flex-col gap-4">
        <a routerLink="/register" class="btn-primary self-start">
          Create account
        </a>
      </div>
    </div>
  </section>

  <!-- Right: Login form -->
  <section class="flex flex-col justify-center px-6 py-16 sm:px-12 bg-surface">
    <div class="mx-auto w-full max-w-md">

      <div class="mb-8">
        <h1 class="text-3xl font-bold text-foreground">Log in</h1>
        <p class="mt-2 text-muted">Welcome back to e-Leseni.</p>
      </div>

      <form class="flex flex-col gap-5" (ngSubmit)="submit()">
        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-foreground">Username</span>
          <input
            class="input-field"
            type="text"
            name="username"
            autocomplete="username"
            placeholder="Username"
            required
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-foreground">Password</span>
            <a routerLink="/forgot-password" class="text-xs font-semibold text-primary hover:underline">Forgot password?</a>
          </div>
          <input
            class="input-field"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Password"
            required
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
          />
        </label>

        @if (errorMessage()) {
          <p class="px-4 py-3 text-sm font-semibold text-danger border border-danger/30 bg-danger/5" style="border-radius: 2px;">
            {{ errorMessage() }}
          </p>
        }

        <button type="submit" class="btn-primary w-full mt-2" [disabled]="submitting()">
          @if (submitting()) { Logging in… } @else { Log in }
        </button>

        <!-- Mobile fallback -->
        <p class="text-center text-sm text-muted lg:hidden">
          No account yet?
          <a routerLink="/register" class="ml-1 font-bold text-primary hover:underline">Register here →</a>
        </p>
      </form>

    </div>
  </section>

</div>
