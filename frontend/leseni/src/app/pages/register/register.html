<!-- Register page: form left, branding right -->
<div class="min-h-[calc(100dvh-5rem)] grid lg:grid-cols-2">

  <!-- Left: Register form -->
  <section class="flex flex-col justify-center px-6 py-16 sm:px-12 bg-surface">
    <div class="mx-auto w-full max-w-md">

      <div class="mb-8">
        <h1 class="text-3xl font-bold text-foreground">Register</h1>
        <p class="mt-2 text-muted">Create a new account.</p>
      </div>

      <form class="flex flex-col gap-5" (ngSubmit)="submit()">
        <div class="grid gap-4 sm:grid-cols-2">
          <label class="flex flex-col gap-1.5">
            <span class="text-sm font-semibold text-foreground">First name</span>
            <input
              class="input-field"
              type="text"
              name="first_name"
              placeholder="First name"
              required
              [ngModel]="form().first_name"
              (ngModelChange)="update('first_name', $event)"
            />
          </label>
          <label class="flex flex-col gap-1.5">
            <span class="text-sm font-semibold text-foreground">Last name</span>
            <input
              class="input-field"
              type="text"
              name="last_name"
              placeholder="Last name"
              required
              [ngModel]="form().last_name"
              (ngModelChange)="update('last_name', $event)"
            />
          </label>
        </div>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-foreground">Username</span>
          <input
            class="input-field"
            type="text"
            name="username"
            autocomplete="username"
            placeholder="Username"
            required
            [ngModel]="form().username"
            (ngModelChange)="update('username', $event)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-foreground">Email</span>
          <input
            class="input-field"
            type="email"
            name="email"
            autocomplete="email"
            placeholder="Email address"
            required
            [ngModel]="form().email"
            (ngModelChange)="update('email', $event)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-foreground">Phone number</span>
          <input
            class="input-field"
            type="tel"
            name="phone_number"
            placeholder="Phone number"
            required
            [ngModel]="form().phone_number"
            (ngModelChange)="update('phone_number', $event)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-foreground">
            NIDA number
            <span class="ml-1 font-normal text-muted">(optional now, required before approval)</span>
          </span>
          <input
            class="input-field font-mono"
            type="text"
            name="nida_number"
            inputmode="numeric"
            maxlength="20"
            placeholder="NIDA number (20 digits)"
            [ngModel]="form().nida_number"
            (ngModelChange)="update('nida_number', $event)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-foreground">Password</span>
          <input
            class="input-field"
            type="password"
            name="password"
            autocomplete="new-password"
            placeholder="Password"
            minlength="8"
            required
            [ngModel]="form().password"
            (ngModelChange)="update('password', $event)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-sm font-semibold text-foreground">Confirm password</span>
          <input
            class="input-field"
            [class.border-danger]="passwordMismatch()"
            [class.focus:ring-danger]="passwordMismatch()"
            type="password"
            name="confirm_password"
            autocomplete="new-password"
            placeholder="Confirm password"
            minlength="8"
            required
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
          />
          @if (passwordMismatch()) {
            <span class="text-xs font-semibold text-danger">Passwords do not match.</span>
          }
        </label>

        @if (errorMessage()) {
          <p class="px-4 py-3 text-sm font-semibold text-danger border border-danger/30 bg-danger/5" style="border-radius: 2px;">
            {{ errorMessage() }}
          </p>
        }

        <button type="submit" class="btn-primary w-full mt-2" [disabled]="submitting()">
          @if (submitting()) { Creating account… } @else { Create account }
        </button>

        <!-- Mobile fallback -->
        <p class="text-center text-sm text-muted lg:hidden">
          Already have an account?
          <a routerLink="/login" class="ml-1 font-bold text-primary hover:underline">Log in →</a>
        </p>
      </form>

    </div>
  </section>

  <!-- Right: Brand / switch to Login — login.jpg background with white overlay -->
  <section class="relative hidden overflow-hidden bg-soft px-12 py-16 lg:flex lg:flex-col lg:items-start lg:justify-center">
    <img
      src="assets/login.jpg"
      alt=""
      aria-hidden="true"
      class="absolute inset-0 h-full w-full object-cover"
    />
    <!-- Light overlay keeps text readable and the palette bright -->
    <div class="absolute inset-0 bg-white/80" aria-hidden="true"></div>

    <div class="relative max-w-sm flex flex-col gap-6">
      <span class="inline-block h-3 w-3 bg-primary" aria-hidden="true"></span>
      <h2 class="text-4xl font-bold leading-[1.25] text-foreground">e-Leseni Platform</h2>
      <p class="text-lg leading-[1.75] text-body">
        Start applying for business licences today.
      </p>

      <div class="border-t border-hairline-strong/40 pt-6 flex flex-col gap-4">
        <a routerLink="/login" class="btn-primary self-start">
          Log in
        </a>
      </div>
    </div>
  </section>

</div>
