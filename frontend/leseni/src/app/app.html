<!-- e-Leseni shell: full-height layout with header, routed content and footer. -->
<div class="flex min-h-dvh flex-col">
  <header class="sticky top-0 z-10 border-b border-brand-lime/20 bg-brand-purple-deep/95 backdrop-blur">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
      <a routerLink="/" class="flex items-center gap-2">
        <span
          class="grid h-9 w-9 place-items-center rounded-lg bg-brand-lime font-black text-brand-purple"
          >eL</span
        >
        <span class="text-lg font-bold tracking-tight">e-Leseni</span>
      </a>

      <nav class="flex items-center gap-2 text-sm font-semibold sm:gap-4">
        @if (auth.isLoggedIn()) {
          <a routerLink="/dashboard" class="rounded-lg px-3 py-2 hover:bg-brand-lime/10">
            Dashboard
          </a>
          <button type="button" class="btn-secondary !px-4 !py-2" (click)="logout()">
            Log out
          </button>
        } @else {
          <a routerLink="/login" class="rounded-lg px-3 py-2 hover:bg-brand-lime/10">Log in</a>
          <a routerLink="/register" class="btn-primary !px-4 !py-2">Get started</a>
        }
      </nav>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-brand-lime/20 bg-brand-purple-deep/95">
    <div
      class="mx-auto flex w-full max-w-6xl flex-col items-center justify-between gap-2 px-4 py-6 text-sm text-brand-lime/70 sm:flex-row sm:px-6"
    >
      <span>© {{ year }} e-Leseni — Business licensing, simplified.</span>
      <span class="badge-outline">Powered by LGA e-Services</span>
    </div>
  </footer>
</div>
