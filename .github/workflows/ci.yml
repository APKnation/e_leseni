name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leseni
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: leseni
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Seed demo data
        working-directory: backend
        run: python manage.py seed_demo_data --skip-wards
      - name: Backend tests
        working-directory: backend
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/leseni/package-lock.json
      - name: Install frontend deps
        working-directory: frontend/leseni
        run: npm ci
      - name: Build (production, includes typecheck)
        working-directory: frontend/leseni
        run: npx ng build --configuration production
      - name: Record dev-server PIDs for cleanup
        if: always()
        id: pids
        working-directory: frontend/leseni
        run: echo "dir=$PWD" >> "$GITHUB_OUTPUT"

      # ---- e2e: bring up the full dev stack, then run Playwright ----
      - name: Start backend
        working-directory: backend
        env:
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: leseni
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ci-only-secret
          SMS_BACKEND: console
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo_data --skip-wards
          nohup python manage.py runserver 0.0.0.0:8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/regions/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/regions/ > /dev/null || (cat /tmp/backend.log && exit 1)
      - name: Start frontend dev server
        working-directory: frontend/leseni
        run: |
          nohup npx ng serve --port 4200 --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
      - name: Wait for frontend
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:4200/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4200/ > /dev/null || (cat /tmp/frontend.log && exit 1)
      - name: Install Playwright browsers
        working-directory: frontend/leseni
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: frontend/leseni
        run: npm run e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/leseni/test-results/
            frontend/leseni/playwright-report/
          retention-days: 7
      - name: Stop dev servers
        if: always()
        run: |
          [ -f /tmp/backend.pid ] && kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          [ -f /tmp/frontend.pid ] && kill "$(cat /tmp/frontend.pid)" 2>/dev/null || true
